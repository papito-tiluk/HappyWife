<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Perfume Cabinet</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B4%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,600;1,500&family=Hanken+Grotesk:wght@400;600&display=swap">
<style>
:root{--bg:#f2eef5;--card:#fbf9fd;--ink:#20152b;--muted:#6d6178;--line:#d9cfe2;--accent:#8c2f5b;--onaccent:#fff;--gold:#a67c1f;--wood:#7a5233;--p1:#a07a52;--p2:#6b4a2f;--back:#efe5da;--back2:#e2d4c4;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f1c;--card:#1e1627;--ink:#f3ecf7;--muted:#a99bb6;--line:#33283f;--accent:#e07aa6;--onaccent:#1a0f16;--gold:#d8b45c;--wood:#4a3322;--p1:#6d4d33;--p2:#3f2b1c;--back:#241a2c;--back2:#181020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f1c;--card:#1e1627;--ink:#f3ecf7;--muted:#a99bb6;--line:#33283f;--accent:#e07aa6;--onaccent:#1a0f16;--gold:#d8b45c;--wood:#4a3322;--p1:#6d4d33;--p2:#3f2b1c;--back:#241a2c;--back2:#181020;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;line-height:1.45}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:52rem;margin:0 auto;padding:1.1rem 1rem 3rem}
h1{font-family:"Bodoni Moda",Georgia,serif;font-weight:600;font-size:2.1rem;line-height:1.1;margin:.3rem 0 .2rem}
.sub{color:var(--muted);margin:0 0 .9rem}
input[type=search]{width:100%;font:inherit;padding:.75rem .9rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.tools{display:flex;gap:.5rem;margin:.6rem 0}
select{font:inherit;padding:.6rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:inherit;font-weight:600;min-height:42px;padding:.45rem 1rem;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button.main{background:var(--accent);color:var(--onaccent)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.6rem}
.chips button{white-space:nowrap;border-color:var(--line);color:var(--ink);min-height:36px;padding:.2rem .8rem;font-weight:400}
.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cab{border:10px solid var(--wood);border-radius:14px;background:radial-gradient(ellipse at 50% 0,var(--back),var(--back2));box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.6rem,1fr))}
.slot{display:flex;flex-direction:column;padding:.9rem .55rem 0;border:0;border-radius:0;background:none;color:var(--ink);text-align:center;font-weight:400;min-height:0}
.ph{aspect-ratio:3/4;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.slot small{display:block;margin-top:.45rem;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slot b{font-size:.8rem;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot::after{content:"";display:block;height:12px;margin:.6rem -1px 0;background:linear-gradient(var(--p1),var(--p2));box-shadow:0 4px 6px rgba(0,0,0,.3);margin-top:auto;position:relative;top:0}
.slot span.sp{flex:1;min-height:.6rem}
.empty{padding:2rem;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:.8rem;margin-top:1rem}
dialog{border:0;border-radius:16px;padding:0;width:min(32rem,94vw);background:var(--card);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(10,5,15,.65)}
.dh{display:flex;gap:1rem;padding:1rem}
.dh .ph{width:38%;flex:none}
.dh h2{font-family:"Bodoni Moda",Georgia,serif;font-weight:600;font-size:1.5rem;line-height:1.1;margin:.1rem 0 .3rem}
.house{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fam{display:inline-block;font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:.1rem .6rem;margin-top:.3rem}
.tag{display:inline-block;font-size:.75rem;color:var(--gold);font-weight:600;margin-bottom:.2rem}
.pyr{padding:0 1rem 1rem}
.lv{padding:.55rem .8rem;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 10px 10px 0;margin-bottom:.45rem}
.lv b{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.t5h{font-family:"Bodoni Moda",Georgia,serif;font-weight:600;font-size:1.25rem;margin:.2rem 0 .5rem}
.t5{display:flex;gap:.7rem;overflow-x:auto;padding:.5rem .2rem .9rem;margin-bottom:.4rem}
.t5c{flex:0 0 6.3rem;text-align:center;position:relative}
.t5c .op{display:block;width:100%;padding:0;border:0;background:none;color:var(--ink);min-height:0;font-weight:400}
.rk{position:absolute;top:-.45rem;left:-.35rem;z-index:2;width:1.8rem;height:1.8rem;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--onaccent);font-family:"Bodoni Moda",Georgia,serif;font-weight:600}
.t5c small{display:block;margin-top:.35rem;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t5c b{font-size:.8rem;line-height:1.2;display:block}
.t5e{aspect-ratio:3/4;border:2px dashed var(--line);border-radius:6px;display:grid;place-items:center;padding:.4rem;color:var(--muted);font-size:.72rem}
.mv{display:flex;justify-content:center;gap:.3rem;margin-top:.35rem}
.mv button{min-height:32px;padding:0 .7rem}
.ph{position:relative}
.hrt{position:absolute;top:.2rem;right:.3rem;color:var(--accent);font-size:1rem;text-shadow:0 0 3px #fff;z-index:1}
.sec{padding:0 1rem;margin-bottom:.9rem}
.sec h3{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 .45rem;font-weight:600}
.chip{display:inline-block;font-size:.8rem;padding:.15rem .65rem;margin:0 .25rem .3rem 0;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.acc .chip:first-child{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.tier{margin:0 auto .35rem;padding:.5rem .7rem;border-radius:10px;background:var(--bg);text-align:center;border:1px solid var(--line)}
.tier b{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:.25rem}
.tier .chip{background:var(--card)}
.meta{font-size:.82rem;color:var(--muted);margin:.35rem 0 0}
.da{display:flex;gap:.5rem;padding:0 1rem 1rem;flex-wrap:wrap}


.cls{margin:.25rem 0 0;font-size:.85rem;color:var(--muted)}
.ab{margin:0 0 .3rem;padding:.3rem .6rem;border-radius:4px;font-size:.82rem;font-weight:600;min-width:6rem;white-space:nowrap}
.rt{margin:.4rem 0 0;font-size:.9rem;font-weight:600}
.chk{margin:.4rem 0 .6rem;padding:.4rem .7rem;border-radius:8px;background:var(--bg);border:1px dashed var(--line);font-size:.8rem;color:var(--muted)}
</style>
</head>

<main>
<h1>The Perfume Cabinet</h1>

<div class="tools"><select id="sort" aria-label="Sort"><option value="name">Sort: name</option><option value="house">Sort: house</option></select><button class="main" id="pick">Pick for today</button></div>
<div class="chips" id="chips" role="group" aria-label="Filter by scent family"></div>
<div class="cab"><div class="grid" id="grid"></div></div>
<p class="foot">Launch year, perfumer and style are being copied from Fragrantica bottle by bottle. Until a bottle is checked, its page says so. The top 5 is saved on this device. Tap “Fragrantica” on any bottle to open its page.</p>
</main>

function renderTop(){

 $("t5").innerHTML=h}

 var l = B.filter(function(b){
  if(re && !re.test(b.family)) return false;
  return !q || norm([b.house,b.name,b.family,b.top,b.heart,b.base].join(" ")).indexOf(q) > -1});
 l.sort(function(a,b){return st.sort==="house" ? (a.house+a.name).localeCompare(b.house+b.name) : a.name.localeCompare(b.name)});
 return l}
function render(){
 cur = list();
 $("count").textContent = cur.length + " of " + B.length + " bottles";
 $("grid").innerHTML = cur.length ? cur.map(function(b,i){
  return '<button class="slot" data-i="'+i+'" aria-label="'+esc(b.house+" "+b.name)+'"><div class="ph">'+(FAV.indexOf(b.name)>-1?'<span class="hrt">♥</span>':'')+'<img loading="lazy" alt="" src="'+b.p+'"></div><small>'+esc(b.house)+'</small><b>'+esc(b.name)+'</b><span class="sp"></span></button>'}).join("") : '<p class="empty">No bottles match. Try another word.</p>'}
function chips(){
 $("chips").innerHTML = F.map(function(f,i){return '<button data-f="'+i+'" aria-pressed="'+(i===st.f)+'">'+f[0]+'</button>'}).join("")}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function chipsOf(s){return s.split(/,\s*|\s+and\s+/).filter(Boolean).map(function(x){return '<span class="chip">'+esc(cap(x.trim()))+'</span>'}).join("")}
var AC={rose:"#e0457b",floral:"#f06292","white floral":"#efe9e1",woody:"#8d6e63",musky:"#cdbfd8",amber:"#e08a1e",vanilla:"#f3e0a0",citrus:"#f4d03f",fruity:"#e8505b",sweet:"#e5707e",powdery:"#e8c6d6","warm spicy":"#c0392b","fresh spicy":"#7cb342",green:"#6aa84f",iris:"#b39ddb",leather:"#5d4037",patchouli:"#6d6a3a",earthy:"#7b6a4a",balsamic:"#a1665e",aromatic:"#5ca08e",coconut:"#f1e9dc",almond:"#d9b99b",honey:"#e3a81d",cherry:"#b3123a",oud:"#4a342a",tropical:"#f39c3d",gourmand:"#8a5a44",cacao:"#5a3a2a",tobacco:"#6e4a2a",lactonic:"#f2e8d5","yellow floral":"#f2d34a",tuberose:"#f5e1d8"};
function fg(c){var n=parseInt(c.slice(1),16),l=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);return l>160?"#20152b":"#fff"}
function show(i,tag){
 at=i; var b=cur[i]; if(!b) return;
 var url=b.fu||"https://www.fragrantica.com/search/?query="+encodeURIComponent(b.house+" "+b.name);
 var meta=[b.y?"Launched "+b.y:"",b.n?"Perfumer: "+b.n:""].filter(Boolean).join(" · ");
 var has=b.top||b.heart||b.base;
 var cl=b.cls?'<p class="cls">'+esc(b.cls)+' fragrance for '+esc(b.g||"")+'</p>':'';
 var rt=b.r?'<p class="rt">★ '+esc(b.r)+' / 5'+(b.rv?' · '+esc(b.rv)+' votes':'')+'</p>':'';
 var acc=b.acc?'<div class="sec"><h3>Main accords</h3>'+b.acc.map(function(a){var c=AC[a[0].toLowerCase()]||"#999";return '<div class="ab" style="width:'+Math.max(a[1],24)+'%;background:'+c+';color:'+fg(c)+'">'+esc(a[0])+'</div>'}).join("")+'</div>':'';
 var nt=has?'<div class="tier" style="width:70%"><b>Top</b>'+chipsOf(b.top)+'</div><div class="tier" style="width:85%"><b>Middle</b>'+chipsOf(b.heart)+'</div><div class="tier"><b>Base</b>'+chipsOf(b.base)+'</div>':'';
 var ck=b.f?'':'<p class="chk">'+(has?'These notes come from brand and retailer pages and are not yet checked against Fragrantica.':'Notes and accords will appear once they are copied from Fragrantica.')+'</p>';
 $("dbody").innerHTML = '<div class="dh"><div class="ph"><img alt="'+esc(b.house+" "+b.name)+'" src="'+b.p+'"></div><div>'+(tag?'<span class="tag">'+tag+'</span><br>':'')+'<span class="house">'+esc(b.house)+'</span><h2>'+esc(b.name)+'</h2>'+cl+(meta?'<p class="meta">'+esc(meta)+'</p>':'')+rt+'</div></div>'
 +acc+'<div class="sec"><h3>Fragrance notes</h3>'+ck+nt+'</div>'
 +'<div class="sec"><button class="main" id="fav" style="width:100%">'+(FAV.indexOf(b.name)>-1?'♥ In her top 5 (#'+(FAV.indexOf(b.name)+1)+'). Tap to remove':'♡ Add to her top 5')+'</button><p class="meta" id="fm"></p></div>'
 +'<div class="da"><button id="prev" aria-label="Previous bottle">‹</button><a class="btn" href="'+url+'" target="_blank" rel="noopener">Fragrantica ↗</a><button id="next" aria-label="Next bottle">›</button><button id="close">Close</button></div>';
 if(!$("dlg").open) $("dlg").showModal();
 $("fav").onclick = function(){
  var k=FAV.indexOf(b.name);
  if(k>-1){FAV.splice(k,1)}
  else if(FAV.length>=5){$("fm").textContent="Her top 5 is full. Remove one first.";return}
  else FAV.push(b.name);
  saveFav();renderTop();render();show(at)};
 $("prev").onclick = function(){show((at-1+cur.length)%cur.length)};
 $("next").onclick = function(){show((at+1)%cur.length)};
 $("close").onclick = function(){$("dlg").close()}}
$("t5").onclick = function(e){var b=e.target.closest("button");if(!b||b.disabled)return;var a=b.dataset.act,i=+b.dataset.i;
 if(a==="open")return openByName(b.dataset.n);
 var j=a==="left"?i-1:i+1;if(j<0||j>=FAV.length)return;var x=FAV[i];FAV[i]=FAV[j];FAV[j]=x;saveFav();renderTop()};
$("grid").onclick = function(e){var s=e.target.closest(".slot");if(s)show(+s.dataset.i)};
$("chips").onclick = function(e){var b=e.target.closest("button");if(!b)return;st.f=+b.dataset.f;chips();render()};
$("q").oninput = function(){st.q=this.value;render()};
$("sort").onchange = function(){st.sort=this.value;render()};
$("pick").onclick = function(){if(!cur.length)return;show(Math.floor(Math.random()*cur.length),"Today’s pick")};
$("dlg").onclick = function(e){if(e.target===this)this.close()};
document.onkeydown = function(e){if(!$("dlg").open)return;if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click()};
chips();render();renderTop();
</script>
</body>
</html>
